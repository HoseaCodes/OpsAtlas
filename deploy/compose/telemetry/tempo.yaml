# Tempo, in its simplest useful shape: local storage, no object store.
#
# Enough to answer "show me this trace" on a developer's machine, and
# deliberately not a production configuration - there is no replication, no
# retention policy beyond the block window, and one process.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short, so a trace is queryable seconds after it is emitted rather than
  # minutes. Wrong for production, right for watching a trace appear.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
