# Every dependency here is either named in CLAUDE.md section 5 or carries a
# justification comment, per the rule that additions need one.

[versions]
java = "21"
springBoot = "3.5.3"
springDependencyManagement = "1.1.7"
archunit = "1.4.1"
uuidGenerator = "5.1.0"
snakeyamlEngine = "2.9"
jsonSchemaValidator = "1.5.6"
springdoc = "2.8.6"

[libraries]
# Justification: Java 21 has no built-in UUIDv7 generator, and CLAUDE.md
# section 7 requires UUIDv7 where ordering helps. Generating application-side
# rather than in Postgres keeps ids available before insert and avoids
# depending on a Postgres version that ships uuidv7().
uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "uuidGenerator" }

# Justification: a YAML 1.2 loader whose safe API is its only API. Its Load
# class returns plain Map/List/String/Number/Boolean and has no
# constructor-based deserialization, so CLAUDE.md section 3 rule 4 is satisfied
# structurally rather than by remembering to set a flag. See ADR 0002.
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyamlEngine" }

# Justification: JSON Schema 2020-12 validation that reports the instance
# location of every failure. That location is what turns an error into a JSON
# Pointer the author of a service.yaml can act on, which section 8 requires.
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }

# Justification: CLAUDE.md section 5 names Springdoc OpenAPI in the fixed stack,
# and section 9 requires the OpenAPI document to be generated from the code
# rather than hand-maintained. See ADR 0005.
#
# This is the -ui starter rather than -api: it depends on -api, so the generated
# document is produced exactly as before, and it additionally serves Swagger UI
# so the contract can be read and exercised in a browser instead of only as
# JSON. Whether that UI is served is a configuration decision, not a build one -
# see springdoc.swagger-ui in application.yaml.
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# Justification: test scope only. This is the mechanism that makes the module
# boundaries in ADR 0001 real rather than aspirational.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
