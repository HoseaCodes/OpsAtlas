# Schema-valid but semantically wrong. JSON Schema cannot express "unique by a
# child property", so this is caught in the normalizer, which is also what lets
# the error point at the second entry rather than at the whole array.
apiVersion: opsatlas.ambitiousconcepts.io/v1
kind: Service
metadata:
  name: orders-api
  repository: ambitious-concepts/orders-api
spec:
  tier: 1
  environments:
    - name: production
      url: https://orders.example.com
    - name: production
      url: https://orders-eu.example.com
