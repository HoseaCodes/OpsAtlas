# Configuration comes from environment variables. The defaults below are for
# local development only and match deploy/compose/docker-compose.yml.
# CLAUDE.md section 3 rule 5: secrets never enter source control. The password
# default here is the local compose password and grants access to nothing else.

spring:
  application:
    name: opsatlas-control-plane

  datasource:
    url: ${OPSATLAS_DB_URL:jdbc:postgresql://localhost:5432/opsatlas}
    username: ${OPSATLAS_DB_USERNAME:opsatlas}
    password: ${OPSATLAS_DB_PASSWORD:opsatlas}
    hikari:
      pool-name: opsatlas-pool
      maximum-pool-size: ${OPSATLAS_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate's job is to fail loudly at startup if
      # the entities and the migrations have drifted apart - never to create or
      # alter a table. `validate` is what makes the migrations the source of
      # truth rather than a parallel description of it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

server:
  port: ${OPSATLAS_PORT:8080}
  error:
    # Errors are produced by ApiExceptionHandler as RFC 9457 problem documents.
    # Spring's default error attributes would leak exception messages and stack
    # traces into responses.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

logging:
  pattern:
    # Every line carries the correlation id and the organization, so a reported
    # failure and the log line that explains it are the same search.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId:-none} org=%X{orgId:-none}] %logger{36} - %msg%n"
  level:
    com.ambitiousconcepts.opsatlas: ${OPSATLAS_LOG_LEVEL:INFO}
