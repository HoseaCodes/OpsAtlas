# Configuration comes from environment variables. The defaults below are for
# local development only and match deploy/compose/docker-compose.yml.
# CLAUDE.md section 3 rule 5: secrets never enter source control. The password
# default here is the local compose password and grants access to nothing else.

spring:
  # ---------------------------------------------------------------------------
  # Authentication (ADR 0013). OpsAtlas verifies RS256 tokens issued by
  # Storm-Gate against its published key set. It holds no signing key: it can
  # check a token and cannot mint one, which is why this names a JWKS URI and
  # never a secret.
  #
  # The defaults point at a local Storm-Gate. They are development defaults, not
  # a deployment: OPSATLAS_OIDC_ISSUER and OPSATLAS_OIDC_JWKS_URI must both be
  # set wherever this runs for real, and the issuer must be publishing RS256
  # (Storm-Gate defaults to HS256, under which a verifier would need the secret
  # that also mints - see ADR 0013).
  # ---------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OPSATLAS_OIDC_JWKS_URI:http://localhost:8090/.well-known/jwks.json}
          issuer-uri: ${OPSATLAS_OIDC_ISSUER:http://localhost:8090}
          # Storm-Gate stamps the subject as `id`, not `sub`. Left at the
          # default, every request would authenticate as nobody.
          principal-claim-name: id

  application:
    name: opsatlas-control-plane

  datasource:
    url: ${OPSATLAS_DB_URL:jdbc:postgresql://localhost:5432/opsatlas}
    username: ${OPSATLAS_DB_USERNAME:opsatlas}
    password: ${OPSATLAS_DB_PASSWORD:opsatlas}
    hikari:
      pool-name: opsatlas-pool
      maximum-pool-size: ${OPSATLAS_DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate's job is to fail loudly at startup if
      # the entities and the migrations have drifted apart - never to create or
      # alter a table. `validate` is what makes the migrations the source of
      # truth rather than a parallel description of it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  threads:
    virtual:
      enabled: true

  http:
    client:
      # Timeouts for every outbound call. An unbounded read is how a scheduled
      # job stops being scheduled: one unresponsive host holds the poll thread
      # and every source behind it silently stops syncing. Deliberately short -
      # this is a background poll of a small file, and a provider that cannot
      # answer in ten seconds should be recorded unreachable and retried.
      connect-timeout: ${OPSATLAS_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${OPSATLAS_HTTP_READ_TIMEOUT:10s}

server:
  port: ${OPSATLAS_PORT:8080}
  error:
    # Errors are produced by ApiExceptionHandler as RFC 9457 problem documents.
    # Spring's default error attributes would leak exception messages and stack
    # traces into responses.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  shutdown: graceful

springdoc:
  # /v3/api-docs is the contract and is always served: it is what `make openapi`
  # captures and what the TypeScript client is generated from (ADR 0005). This
  # block only controls the browsable UI over that same document, which adds no
  # endpoint and changes no response.
  #
  # It defaults OFF. Every endpoint it calls now requires a credential (ADR 0013),
  # so a try-it-out console is no longer a way in - but it is still a page that
  # invites people to make write calls against whatever it is pointed at, and a
  # default that has to be remembered to turn off is a default that will not be.
  # Turn it on deliberately with OPSATLAS_SWAGGER_UI=true; its Authorize button
  # takes either of the schemes the contract declares.
  swagger-ui:
    enabled: ${OPSATLAS_SWAGGER_UI:false}
    # Land on a list of operations rather than every schema expanded at once,
    # and show how long a try-it-out call took.
    doc-expansion: none
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    db:
      enabled: true

  # ---------------------------------------------------------------------------
  # Telemetry (ADR 0011). Traces are exported over OTLP; metrics are scraped
  # from /actuator/prometheus rather than pushed, so the control plane needs no
  # knowledge of who is collecting.
  # ---------------------------------------------------------------------------
  tracing:
    enabled: ${OPSATLAS_TRACING_ENABLED:true}
    sampling:
      # Everything. This system's traffic is a poll every five minutes and the
      # occasional human request, and sampling would mean the one trace someone
      # goes looking for is the one that was dropped - which would also make the
      # correlation id unreliable, since it *is* the trace id. Recorded in ADR
      # 0011 as the first thing to revisit if volume ever justifies it.
      probability: ${OPSATLAS_TRACE_SAMPLE_RATE:1.0}
    propagation:
      # W3C traceparent, as CLAUDE.md section 9 requires. Named explicitly
      # rather than left to a default, because the observer speaks W3C and a
      # silent switch to B3 would break the join without breaking a build.
      type: w3c

  otlp:
    tracing:
      endpoint: ${OPSATLAS_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      # A collector that is down must not slow down or fail a request. The
      # exporter batches and drops on the floor; losing a trace is an
      # acceptable outcome, delaying a response to deliver one is not.
      timeout: 3s

  observations:
    key-values:
      # Every span and metric carries these, so telemetry from two deployments
      # is separable without guessing from hostnames.
      deployment.environment: ${OPSATLAS_DEPLOYMENT_ENVIRONMENT:local}

# ---------------------------------------------------------------------------
# Repository sync (ADR 0008). OpsAtlas polls; it never registers a webhook and
# never holds write access.
# ---------------------------------------------------------------------------
opsatlas:
  # ---------------------------------------------------------------------------
  # The observer's credential (ADR 0013).
  #
  # The observer is a component of this system rather than a person, so it does
  # not get an account at the identity provider - an audit entry naming a person
  # who does not exist is worse than one naming a machine. It carries a key this
  # system issued, and the audit log calls it `service:observer`.
  #
  # Generate one with `make observer-key`, set it here and on the observer.
  # Changing it rotates: the old key stops working at once. Unset, the observer
  # cannot report at all.
  # ---------------------------------------------------------------------------
  credentials:
    # Named machines, each revocable on its own. The env var names stay friendly;
    # the map is what the code iterates.
    keys: "{observer: '${OPSATLAS_OBSERVER_KEY:}', prometheus: '${OPSATLAS_PROMETHEUS_KEY:}'}"

  # ---------------------------------------------------------------------------
  # The first way in (ADR 0013).
  #
  # A token only works if a `principal` row exists for it, and rows are created
  # by somebody already inside - so a fresh deployment admits nobody. Set these
  # once, to the identity that should get in first, and the row is created on
  # startup if it is missing.
  #
  # Deliberately not "the first caller wins": that is a race with the internet,
  # and losing it once cannot be undone. Setting an environment variable is
  # something only an operator can do.
  #
  # The subject is whatever the issuer stamps - for Storm-Gate, the `id` claim,
  # which you can read out of a token you have just been issued. Leaving these
  # set is harmless; later starts find the row and do nothing.
  # ---------------------------------------------------------------------------
  bootstrap:
    principal:
      issuer: ${OPSATLAS_BOOTSTRAP_ISSUER:}
      subject: ${OPSATLAS_BOOTSTRAP_SUBJECT:}
      display-name: ${OPSATLAS_BOOTSTRAP_DISPLAY_NAME:}

  sync:
    # Set false to stop the scheduler. Tests do this: a timer firing underneath
    # an assertion is a flake generator.
    enabled: ${OPSATLAS_SYNC_ENABLED:true}
    interval: ${OPSATLAS_SYNC_INTERVAL:PT5M}
    initial-delay: ${OPSATLAS_SYNC_INITIAL_DELAY:PT30S}
    batch-size: ${OPSATLAS_SYNC_BATCH_SIZE:25}
  # Retention for the rolled-up observations (ADR 0009). The bound on storage
  # in that decision is only real because the pruning job runs.
  retention:
    enabled: ${OPSATLAS_RETENTION_ENABLED:true}
    # Slightly more than the 30-day ribbon needs, so a prune landing between two
    # requests never leaves a gap at the ribbon's oldest edge.
    days: ${OPSATLAS_RETENTION_DAYS:35}
    idempotency-key-hours: ${OPSATLAS_RETENTION_KEY_HOURS:48}
    interval: ${OPSATLAS_RETENTION_INTERVAL:PT6H}
    initial-delay: ${OPSATLAS_RETENTION_INITIAL_DELAY:PT2M}

  github:
    base-url: ${OPSATLAS_GITHUB_BASE_URL:https://api.github.com}
    # Optional. Unauthenticated reads work for public repositories at 60
    # requests per hour per IP; a token raises that to 5,000. Only the ability
    # to read contents is needed - never grant write scope (ADR 0008).
    token: ${OPSATLAS_GITHUB_TOKEN:}

logging:
  pattern:
    # Every line carries the correlation id and the organization, so a reported
    # failure and the log line that explains it are the same search.
    # correlationId IS the trace id when a request is traced (ADR 0011), so one
    # string in a log line searches the logs, the traces and the audit log.
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [corr=%X{correlationId:-none} org=%X{orgId:-none}] %logger{36} - %msg%n"
  level:
    com.ambitiousconcepts.opsatlas: ${OPSATLAS_LOG_LEVEL:INFO}
