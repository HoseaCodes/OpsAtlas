# Test-wide defaults.
#
# These live in test resources rather than in PostgresTestBase because
# @DynamicPropertySource has no defined ordering between a base class and its
# subclass: a base registering a default would race a test registering a real
# value. Classpath properties sit below @DynamicPropertySource in Spring's
# precedence order, so a test that arranges a stub always wins, and a test that
# does not gets these.

# No test ever gets a live poller. A timer firing underneath an assertion is a
# flake generator, and it would also make the suite reach the real GitHub.
opsatlas.sync.enabled=false

# A port nothing listens on. A test that fetches without arranging a stub fails
# as unreachable rather than silently calling api.github.com - which would make
# the suite depend on the network, on rate limits, and on somebody else's uptime.
opsatlas.github.base-url=http://127.0.0.1:1

# The retention job is a timer like the poller, and off for the same reason: a
# prune firing underneath an assertion about counted days is a flake generator.
opsatlas.retention.enabled=false
