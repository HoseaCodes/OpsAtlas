# Publish the three application images to GHCR.
#
# Separate from ci.yml on purpose: ci.yml decides whether a commit is any good,
# and this decides what a deployment can run. Tying them together would mean
# either publishing images for commits that failed their tests, or re-running
# the whole suite to cut a release.
#
# It exists because deploy/production/docker-compose.yml pulls by tag rather
# than building. A 4GB box running Gradle while it serves traffic is a bad
# afternoon, and without this the compose file would reference images that do
# not exist — the promise the local compose file deliberately refused to make.
name: Publish images

on:
  # A release is a tag. `latest` is not a deployable identifier: the whole point
  # of OPSATLAS_TAG in the compose file is being able to name what is running
  # and roll back to what was.
  push:
    tags: ["v*"]
  # So an image can be cut from master without tagging a release, for a
  # deployment that tracks the branch.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      # One failing image should not cancel the other two: knowing that all
      # three are broken is more useful than knowing one is.
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: apps/control-plane/Dockerfile
          - image: console
            dockerfile: apps/web/Dockerfile
          - image: observer
            dockerfile: apps/observer/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The token the workflow already has. No stored registry credential,
          # which is one fewer secret that can leak or expire.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/opsatlas-${{ matrix.image }}
          # A version tag when there is one, and the commit SHA always — so
          # every published image is traceable to the source that built it even
          # if it was cut by hand from master.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          # The repository root, matching the Dockerfiles: all three copy paths
          # like apps/observer/ and packages/contracts/, so a narrower context
          # would not build.
          context: .
          file: ${{ matrix.dockerfile }}
          # linux/amd64 only. Every host under consideration is x86, and the
          # arm64 builds these Dockerfiles support would go through QEMU here
          # and take long enough to matter. If this deploys to ARM — Oracle's
          # free Ampere tier, say — add a native `ubuntu-24.04-arm` runner to
          # the matrix and merge the manifests, rather than emulating.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The control-plane build resolves the Gradle dependency graph and the
          # console installs a pnpm workspace. Both are the slow layer, and both
          # are cacheable.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
